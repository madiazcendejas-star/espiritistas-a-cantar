<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espiritistas a Cantar | Acceso a la Academia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #ffffff; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12 relative overflow-hidden">
    
    <!-- Decoración de fondo elegante -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 opacity-20 pointer-events-none">
        <div class="absolute -top-[20%] -right-[10%] w-[50%] h-[50%] bg-indigo-600 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[10%] -left-[10%] w-[40%] h-[40%] bg-blue-600 blur-[100px] rounded-full"></div>
    </div>

    <!-- Header -->
    <header class="flex justify-between items-center max-w-7xl mx-auto w-full z-10 relative">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md">EC</div>
            <span class="font-bold tracking-wider text-lg">Espiritistas a Cantar</span>
        </div>
        <div class="hidden md:flex gap-6 text-sm text-slate-300 font-medium">
            <span>Soporte WhatsApp: 56 3208 7410</span>
        </div>
    </header>

    <!-- Contenedor del Login -->
    <main class="flex-1 flex flex-col items-center justify-center max-w-md mx-auto w-full py-8 z-10 relative">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Bienvenido</h1>
            <p class="text-slate-400 text-sm">Ingresa a tu plataforma académica y de gestión.</p>
        </div>
        
        <div class="bg-white text-slate-800 rounded-2xl w-full p-8 shadow-2xl border border-slate-200">
            <form onsubmit="intentarIngreso(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Usuario o Teléfono</label>
                    <input type="text" id="loginTelefono" required placeholder="Ej. admin o tu teléfono" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 bg-slate-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1.5">Contraseña</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full px-4 py-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 bg-slate-50">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-semibold transition shadow-sm text-sm">Iniciar sesión</button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="max-w-7xl mx-auto w-full text-center text-xs text-slate-500 z-10">
        <p>© 2026 Espiritistas a Cantar. Todos los derechos reservados.</p>
    </footer>

    <!-- Lógica de Conexión a Supabase -->
    <script>
        const SUPABASE_URL = "https://seodpbbkqjecohbwljud.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_x_UVfWe9JY2MEiJNf6PqWw_7Cndda2u";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADMIN_USER = "admin";
        const ADMIN_PASS = "EAC2026_Secure*";

        async function intentarIngreso(event) {
            event.preventDefault();
            const usuario = document.getElementById('loginTelefono').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            // Validar si es el Administrador
            if (usuario === ADMIN_USER && pass === ADMIN_PASS) {
                localStorage.setItem('eac_sesion', JSON.stringify({ rol: 'admin' }));
                alert('¡Bienvenido Administrador! En el siguiente paso conectaremos el panel de control.');
                return;
            }

            // Validar en Supabase para alumnos
            const { data, error } = await supabaseClient.from('alumnos').select('*').or(`telefono.eq.${usuario},correo.eq.${usuario}`).eq('password', pass).single();
            
            if (error || !data) {
                alert('Credenciales incorrectas. Verifica tus datos.');
                return;
            }

            alert(`¡Hola ${data.Nombre}! Acceso de estudiante verificado con éxito.`);
        }
    </script>
</body>
</html>
