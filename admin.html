<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espiritistas a Cantar | Panel Administrador</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .sidebar-item { transition: all 0.15s ease; color: #94a3b8; font-size: 0.875rem; font-weight: 500; }
        .sidebar-item:hover { background-color: rgba(255, 255, 255, 0.06); color: #ffffff; }
        .sidebar-item.active { background-color: #4f46e5; color: #ffffff; font-weight: 600; }
        .card-premium { background: #ffffff; border-radius: 1rem; border: 1px solid #e2e8f0; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="antialiased h-screen flex overflow-hidden">
    
    <!-- SIDEBAR ESTILO CRAQUI -->
    <aside class="w-64 bg-[#0f172a] text-slate-300 hidden md:flex flex-col border-r border-slate-800/60 z-20 flex-shrink-0">
        <!-- Header de Cuenta -->
        <div class="h-16 px-5 flex items-center border-b border-slate-800/60">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-indigo-600 text-white rounded-lg flex items-center justify-center font-bold text-xs shadow-sm">EC</div>
                <div class="flex flex-col">
                    <span class="font-bold text-white text-[13px] leading-tight">Espiritistas a Cantar</span>
                    <span class="text-[10px] text-indigo-400 font-medium">Propietario</span>
                </div>
            </div>
        </div>

        <!-- Navegación del Panel -->
        <nav class="flex-1 py-4 px-3 space-y-1 overflow-y-auto">
            <div class="px-3 pb-2 pt-1 text-[10px] uppercase tracking-wider text-slate-500 font-bold">Gestión</div>
            <a href="admin.html" class="sidebar-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg">
                📊 Inicio
            </a>
            <a href="#" onclick="alert('En el próximo paso agregaremos la vista completa de Estudiantes.')" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg">
                🎓 Estudiantes
            </a>
            <a href="#" onclick="alert('En el próximo paso agregaremos la vista completa de Cursos.')" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg">
                📚 Cursos
            </a>
        </nav>

        <!-- Footer Sidebar -->
        <div class="p-4 border-t border-slate-800/60">
            <button onclick="cerrarSesion()" class="w-full flex items-center justify-center gap-2 bg-slate-800/40 hover:bg-slate-800 text-slate-300 py-2 rounded-lg text-xs font-semibold transition">
                Cerrar sesión
            </button>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full overflow-y-auto relative w-full">
        <!-- Header Superior -->
        <header class="bg-white border-b border-slate-200 h-16 flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm flex-shrink-0">
            <h1 class="text-xl font-bold text-slate-900">Panel de Control</h1>
            <div class="flex items-center gap-3">
                <div class="text-right hidden sm:block">
                    <span class="block text-sm font-semibold text-slate-800 leading-tight">Admin Principal</span>
                    <span class="block text-[11px] text-slate-500">Espiritistas a Cantar</span>
                </div>
                <div class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-sm border border-indigo-200">A</div>
            </div>
        </header>

        <!-- Contenido Dinámico / KPIs -->
        <div class="p-6 md:p-8 max-w-[1400px] mx-auto w-full space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6">
                <!-- KPI 1 -->
                <div class="card-premium p-5 flex flex-col justify-between">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Estudiantes Activos</span>
                    <h3 id="statEstudiantes" class="text-3xl font-bold text-slate-900 mt-2">0</h3>
                </div>
                <!-- KPI 2 -->
                <div class="card-premium p-5 flex flex-col justify-between">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Cursos Operando</span>
                    <h3 id="statCursos" class="text-3xl font-bold text-slate-900 mt-2">0</h3>
                </div>
                <!-- KPI 3 -->
                <div class="card-premium p-5 flex flex-col justify-between">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Ingresos del Mes</span>
                    <h3 id="statIngresos" class="text-2xl font-bold text-emerald-600 mt-2">$0.00</h3>
                </div>
                <!-- KPI 4 -->
                <div class="card-premium p-5 flex flex-col justify-between">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wide">Deuda Vigente</span>
                    <h3 id="statMorosos" class="text-2xl font-bold text-rose-600 mt-2">0</h3>
                </div>
            </div>
        </div>
    </main>

    <!-- Conexión a Supabase para cargar datos reales -->
    <script>
        const SUPABASE_URL = "https://seodpbbkqjecohbwljud.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_x_UVfWe9JY2MEiJNf6PqWw_7Cndda2u";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            cargarDashboardAdmin();
        });

        async function cargarDashboardAdmin() {
            const { data: alumnos } = await supabaseClient.from('alumnos').select('*');
            const { data: cursos } = await supabaseClient.from('cursos').select('*');
            
            document.getElementById('statEstudiantes').innerText = alumnos ? alumnos.length : 0;
            document.getElementById('statCursos').innerText = cursos ? cursos.length : 0;
        }

        function cerrarSesion() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
